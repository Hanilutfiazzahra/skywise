<!DOCTYPE html>

<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Materi - SKYWISE</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-md bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="../../index.html">
                    <img src="../../assets/images/skywise_navy.png" alt="Logo Skywise" height="45">
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuUtama"
                    aria-controls="menuUtama"
                    aria-expanded="false"
                    aria-label="Buka menu navigasi"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuUtama">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../../index.html">Beranda</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="lessons.html">Kelola Materi</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

    </header>


    <main class="container py-4">

        <header class="mb-4">
            <h1>Tambah Materi</h1>
            <p>
                Tambahkan materi astronomi baru ke Skywise.
            </p>

        </header>


        <form action="#" method="post" enctype="multipart/form-data" class="card card-body">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="title" class="form-label">
                        Judul Materi
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="title"
                        name="title"
                        placeholder="Contoh: Saturnus"
                        required
                    >

                </div>


                <div class="col-12 col-md-6">
                    <label for="category" class="form-label">
                        Tema
                    </label>

                    <select
                        class="form-select"
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            -- Pilih Tema --
                        </option>

                        <option value="1">
                            🌍 Kita Ada di Mana?
                        </option>

                        <option value="2">
                            ☀️ Tata Surya
                        </option>

                        <option value="3">
                            ⭐ Bintang
                        </option>

                        <option value="4">
                            🌌 Galaksi
                        </option>

                        <option value="5">
                            🌠 Fenomena Langit
                        </option>

                    </select>

                </div>


                <div class="col-12">
                    <label for="image" class="form-label">
                        Gambar Materi
                    </label>
                    <input
                        type="file"
                        class="form-control"
                        id="image"
                        name="image"
                        accept="image/*"
                    >
                </div>


                <div class="col-12">
                    <label for="content" class="form-label">
                        Isi Materi
                    </label>

                    <textarea
                        class="form-control"
                        id="content"
                        name="content"
                        rows="10"
                        placeholder="Tulis isi materi di sini..."
                        required
                    ></textarea>

                </div>


                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Simpan Materi
                    </button>
                    <a href="lessons.html" class="btn btn-outline-secondary">
                        Batal
                    </a>
                </div>
            </div>
        </form>

    </main>


    <footer>
        <p>
            &copy; 2026 Skywise. Semua hak dilindungi.
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
